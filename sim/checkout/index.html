<meta name="description" content="揀選日本 SoftBank 實體 SIM 方案、寄件方式，安全付款後安排本地寄出。"><meta name="robots" content="noindex,nofollow">

<style>:root{--green:#0ea36b;--ink:#171717;--muted:#676767;--line:#dfe7e3}*{box-sizing:border-box}body{margin:0;background:#f4fbf7;color:var(--ink);font-family:"Noto Sans TC","PingFang HK",sans-serif}.page{max-width:680px;margin:0 auto;padding:44px 18px}.brand{color:var(--green);font-size:14px;font-weight:900;letter-spacing:.08em}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 14px 40px #1231}h1{font-size:30px;line-height:1.2;margin:10px 0}p{color:var(--muted);line-height:1.7}.field{margin-top:18px}.field label{display:block;font-weight:800;margin-bottom:7px}select,input,textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff;font:inherit}textarea{min-height:86px;resize:vertical}.required{color:#d24b37}.hidden{display:none}.hint{margin:7px 0 0;font-size:12px;color:var(--muted)}.summary{margin-top:22px;padding:17px;border-radius:14px;background:#ecfaf2}.row{display:flex;justify-content:space-between;gap:14px;margin:5px 0}.total{padding-top:10px;margin-top:10px;border-top:1px solid #bfe6cd;font-size:20px;font-weight:900}button{width:100%;margin-top:22px;border:0;border-radius:12px;min-height:54px;background:var(--green);color:#fff;font:800 16px inherit;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.fine{font-size:12px;margin-top:14px;text-align:center}</style><style>.discount-input{letter-spacing:.08em;text-transform:uppercase}.notice{padding:12px 14px;border-radius:12px;background:#fff8df;color:#765700;font-size:13px;line-height:1.6}.section-label{margin:26px 0 0;font-size:13px;color:var(--green);font-weight:900;letter-spacing:.08em}</style>
</head><body><main class="page"><div class="brand">EASYGOSIM · 香港本地寄出</div><section class="card"><h1>安全結賬</h1><p>揀好方案後直接付款，完成付款會立即建立訂單。</p><div class="notice"><b>安心購買：</b>付款由 Airwallex 安全處理；我們不會儲存你的信用卡資料。平郵免費，順豐櫃／站可於結賬時選擇。</div><p class="hint">已有會員？<a href="../account/" style="color:var(--green);font-weight:800">先登入</a>，訂單及優惠碼會自動記錄。</p><div class="section-label">1 · 選擇方案</div><div class="field"><label for="plan">數據方案</label><select id="plan"></select></div><div class="field"><label for="days">日數</label><select id="days"></select></div><div class="field"><label for="quantity">購買張數（SIM 卡數量）</label><select id="quantity"></select></div><div class="section-label">2 · 寄件方式</div><div class="field"><label for="shipping">寄件方式</label><select id="shipping"></select></div><section id="sf-pickup" class="hidden"><div class="field"><label for="sfDistrict">香港地區 <span class="required">*</span></label><select id="sfDistrict"><option value="">請選擇 18 區</option></select></div><div class="field"><label for="sfLocation">順豐取件網點 <span class="required">*</span></label><select id="sfLocation" disabled><option value="">請先選擇地區</option></select><p class="hint">已過濾只供住戶使用及不設取件服務的網點。</p></div></section><div class="field"><label for="customerName">姓名 <span class="required">*</span></label><input id="customerName" autocomplete="name" required></div><div class="field"><label for="customerEmail">電郵（選填）</label><input id="customerEmail" type="email" autocomplete="email"><p class="hint">填寫後會收到訂單副本；首次購買成功會獲下次使用的 9 折優惠碼。</p></div><div class="field"><label for="discountCode">優惠碼（選填）</label><input id="discountCode" class="discount-input" autocomplete="off" placeholder="例如 EASYGO9-AB12CD34"><p class="hint">如有之前訂單的 9 折優惠碼，可在這裡輸入；每個優惠碼只可使用一次。</p></div><div class="field hidden" id="phone-field"><label id="phone-label" for="customerPhone">收件人電話 <span class="required">*</span></label><input id="customerPhone" type="tel" autocomplete="tel"></div><div class="field" id="surface-address"><label for="shippingAddress">平郵收件地址 <span class="required">*</span></label><textarea id="shippingAddress" autocomplete="street-address" required></textarea></div><div class="summary"><div class="row"><span>方案</span><b id="plan-price">—</b></div><div class="row"><span>寄件</span><b id="shipping-price">—</b></div><div class="row total"><span>合共</span><b id="total">—</b></div></div><button id="checkout">安全付款</button><p class="fine">付款由 Airwallex 安全處理。未使用可按退款政策申請退款。</p></section></main><script>
const API_BASE='https://checkout-api-production-bfc1.up.railway.app';
let catalog, payments, sfLocations;
const plan=$('#plan'), days=$('#days'), quantity=$('#quantity'), shipping=$('#shipping'), checkout=$('#checkout'), sfPickup=$('#sf-pickup'), sfDistrict=$('#sfDistrict'), sfLocation=$('#sfLocation'), surfaceAddress=$('#surface-address'), phoneField=$('#phone-field'), discountCode=$('#discountCode');
function $(s){return document.querySelector(s)}
function selectedPlan(){return catalog.product.plans.find(x=>x.key===plan.value)}
function price(cost){return Math.round(cost*1.55+3)}
function planPrice(p,i){return catalog.product.pricing==='retail'?Number(p.costs[i]):price(p.costs[i])}
function renderDays(){const p=selectedPlan(); days.innerHTML=p.days.map((d,i)=>`<option value="${d}">${Number(d)} 日 · HK$${planPrice(p,i)}</option>`).join('')}
function update(){const p=selectedPlan(), i=p.days.indexOf(days.value), ship=catalog.shipping[shipping.value], a=planPrice(p,i), qty=Number(quantity.value||1); $('#plan-price').textContent=`HK$${a} × ${qty}`; $('#shipping-price').textContent=`HK$${ship.fee}`; $('#total').textContent=`HK$${a*qty+ship.fee}`}
const DISTRICTS=['中西區','灣仔區','東區','南區','九龍城區','觀塘區','深水埗區','黃大仙區','油尖旺區','葵青區','荃灣區','屯門區','元朗區','北區','大埔區','沙田區','西貢區','離島區'];
function sfType(){return shipping.value==='sf-locker'?'locker':'station'}
function updatePhoneRequirement(){const required=shipping.value!=='surface';phoneField.classList.toggle('hidden',!required);$('#customerPhone').required=required;if(!required)$('#customerPhone').value=''}
function renderSfLocations(){const district=sfDistrict.value;if(!sfLocations||!district){sfLocation.disabled=true;sfLocation.innerHTML='<option value="">請先選擇地區</option>';return}const list=sfLocations.locations.filter(x=>x.type===sfType()&&x.district===district);sfLocation.disabled=false;sfLocation.innerHTML='<option value="">請選擇網點（'+list.length+' 個）</option>'+list.map(x=>'<option value="'+x.code+'">'+x.code+' · '+x.name+'｜'+x.address+'</option>').join('')}
async function setupShippingFields(){const isSf=shipping.value!=='surface';sfPickup.classList.toggle('hidden',!isSf);surfaceAddress.classList.toggle('hidden',isSf);if(!isSf)return;if(!sfLocations){sfLocation.innerHTML='<option>正在載入順豐網點…</option>';try{sfLocations=await fetch('sf-locations.json').then(r=>{if(!r.ok)throw new Error();return r.json()})}catch{sfLocation.innerHTML='<option>未能載入網點，請重新整理</option>';return}}renderSfLocations()}
function deliveryAddress(){if(shipping.value==='surface')return $('#shippingAddress').value.trim();const selected=sfLocations&&sfLocations.locations.find(x=>x.type===sfType()&&x.code===sfLocation.value);return selected?catalog.shipping[shipping.value].name+'\n網點代碼：'+selected.code+'\n'+selected.name+'\n'+selected.address:''}
async function prefillMemberEmail(){const token=localStorage.getItem('easygo_member_token');if(!token)return;try{const r=await fetch(API_BASE+'/api/auth/me',{headers:{Authorization:'Bearer '+token}});if(!r.ok)return;const data=await r.json();if(data.member?.email&&!$('#customerEmail').value)$('#customerEmail').value=data.member.email}catch{}}
async function start(){if(!$('#customerName').value.trim()){alert('請填寫姓名。');$('#customerName').focus();return}if($('#customerEmail').value.trim()&&!$('#customerEmail').checkValidity()){alert('請輸入有效電郵。');$('#customerEmail').focus();return}if(shipping.value!=='surface'&&!$('#customerPhone').value.trim()){alert('選擇順豐取件須填寫收件人電話。');$('#customerPhone').focus();return}const address=deliveryAddress();if(!address){alert(shipping.value==='surface'?'請填寫平郵收件地址。':'請選擇順豐取件網點。');(shipping.value==='surface'?$('#shippingAddress'):sfDistrict).focus();return}checkout.disabled=true;checkout.textContent='正在前往安全付款…';try{const token=localStorage.getItem('easygo_member_token');const r=await fetch(API_BASE+'/api/orders',{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify({productSlug:catalog.product.slug,planKey:plan.value,days:days.value,quantity:quantity.value,shippingKey:shipping.value,customerName:$('#customerName').value.trim(),customerEmail:$('#customerEmail').value.trim(),customerPhone:$('#customerPhone').value.trim(),shippingAddress:address,discountCode:discountCode.value.trim()})});if(!r.ok){const detail=await r.json().catch(()=>null);throw new Error(detail?.error||'暫時未能建立付款，請稍後再試。')}const order=await r.json();payments.redirectToCheckout({env:'prod',mode:'payment',currency:order.currency,intent_id:order.intent_id,client_secret:order.client_secret,successUrl:`${location.origin}/sim/thank-you/?order=${encodeURIComponent(order.reference)}`,cancelUrl:location.href,appearance:{mode:'light',variables:{colorBrand:'#0ea36b'}}})}catch(e){alert(e.message||'暫時未能建立付款，請稍後再試。');checkout.disabled=false;checkout.textContent='安全付款'}}
(async()=>{const params=new URLSearchParams(location.search),slug=params.get('product')||'jpesim-softbank',initialPlan=params.get('plan'),initialDays=params.get('days');const r=await fetch(API_BASE+'/api/catalog/'+encodeURIComponent(slug));if(!r.ok)throw new Error('Product not found');catalog=await r.json();document.title=`${catalog.product.name}｜自助落單｜EasyGoSIM`;document.querySelector('h1').textContent=`${catalog.product.name} 實體 SIM`;plan.innerHTML=catalog.product.plans.map(p=>`<option value="${p.key}">${p.name}</option>`).join('');if(initialPlan&&catalog.product.plans.some(p=>p.key===initialPlan))plan.value=initialPlan;quantity.innerHTML=Array.from({length:10},(_,i)=>`<option value="${i+1}">${i+1} 張</option>`).join('');shipping.innerHTML=Object.entries(catalog.shipping).map(([key,s])=>`<option value="${key}">${s.name} · HK$${s.fee}</option>`).join('');sfDistrict.innerHTML='<option value="">請選擇 18 區</option>'+DISTRICTS.map(x=>'<option value="'+x+'">'+x+'</option>').join('');shipping.value='surface';renderDays();if(initialDays&&[...days.options].some(o=>o.value===initialDays))days.value=initialDays;update();plan.onchange=()=>{renderDays();update()};days.onchange=update;quantity.onchange=update;shipping.onchange=()=>{update();updatePhoneRequirement();setupShippingFields()};sfDistrict.onchange=renderSfLocations;updatePhoneRequirement();setupShippingFields();prefillMemberEmail();({payments}=await window.AirwallexComponentsSDK.init({env:'prod',enabledElements:['payments']}));checkout.onclick=start})()
</script></body></html>
