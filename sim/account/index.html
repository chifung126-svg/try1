</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>會員中心｜EasyGoSIM</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/easygosim-logo.png?v=eg2"><style>:root{--green:#0ea36b;--ink:#17231d;--muted:#68756e;--line:#dce9e1}*{box-sizing:border-box}body{margin:0;background:#f4fbf7;color:var(--ink);font-family:"Noto Sans TC","PingFang HK",sans-serif}.page{max-width:720px;margin:0 auto;padding:34px 18px}.brand{color:var(--green);font-weight:900;letter-spacing:.08em;font-size:14px}.card{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 14px 40px #1231}h1{margin:8px 0;font-size:30px}p{color:var(--muted);line-height:1.7}.field{margin-top:16px}.field label{display:block;font-weight:800;margin-bottom:7px}input{width:100%;min-height:48px;border:1px solid var(--line);border-radius:11px;padding:12px;font:inherit}button,.link{display:inline-block;border:0;border-radius:11px;padding:13px 18px;background:var(--green);color:#fff;font:800 15px inherit;cursor:pointer;text-decoration:none}.secondary{background:#eef8f2;color:var(--green);margin-left:8px}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button{flex:1;background:#eef8f2;color:var(--green)}.tabs .active{background:var(--green);color:#fff}.notice{padding:11px 13px;border-radius:10px;background:#fff6d9;color:#735600}.success{background:#e9f8ef;color:#176b45}.order,.coupon{padding:14px 0;border-bottom:1px solid var(--line)}.order:last-child,.coupon:last-child{border-bottom:0}.order b,.coupon b{color:var(--green)}.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.small{font-size:13px}.share{background:#f0f8f3;padding:15px;border-radius:14px}.code{font-family:monospace;letter-spacing:.04em;font-size:16px}</style></head><body><main class="page"><div class="brand">EASYGOSIM · 會員中心</div><section class="card" id="auth-card"><h1>會員登入／註冊</h1><p>註冊會員即送 9 折優惠碼；分享給朋友，朋友註冊後你和朋友各得一次性 8 折優惠碼。</p><div class="tabs"><button id="login-tab" class="active" type="button">登入</button><button id="register-tab" type="button">註冊</button></div><form id="auth-form"><div class="field hidden" id="name-field"><label for="name">姓名 *</label><input id="name" autocomplete="name"></div><div class="field"><label for="email">電郵 *</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">密碼 *</label><input id="password" type="password" minlength="8" autocomplete="current-password" required></div><button id="submit" type="submit">登入會員</button></form><p id="message" class="notice hidden"></p></section><section class="card hidden" id="account-card"><div class="top"><div><h1>你好，<span id="member-name">會員</span></h1><p id="member-email" class="small"></p></div><button id="logout" class="secondary" type="button">登出</button></div><div id="welcome" class="notice success hidden"></div><div class="share"><b>分享給朋友，獲取 8 折優惠</b><p class="small">朋友使用這條連結完成註冊後，你和朋友各會收到一個一次性 8 折優惠碼。</p><input id="ref-link" readonly><button id="copy-link" type="button" style="margin-top:10px">複製推薦連結</button></div><h2>我的優惠碼</h2><div id="coupons">讀取中…</div><h2>我的訂單</h2><div id="orders">讀取中…</div><p><a class="link" href="../">返回 EasyGoSIM</a></p></section></main><script>const API='https://checkout-api-production-bfc1.up.railway.app';const $=s=>document.querySelector(s);let mode='login';const token=()=>localStorage.getItem('easygo_member_token')||'';function msg(t){$('#message').textContent=t;$('#message').className='notice';if(!t)$('#message').classList.add('hidden')}function setMode(next){mode=next;$('#login-tab').classList.toggle('active',mode==='login');$('#register-tab').classList.toggle('active',mode==='register');$('#name-field').classList.toggle('hidden',mode==='login');$('#submit').textContent=mode==='login'?'登入會員':'建立會員'}function renderCoupons(coupons){$('#coupons').innerHTML=coupons.length?coupons.map(x=>'<div class="coupon"><b class="code">'+x.code+'</b><br>'+x.reason+' · '+(x.discount_percent===10?'9':'8')+'折 · '+(x.used_at?'已使用':'可使用')+'</div>').join(''):'<p>暫時未有優惠碼。</p>'}async function loadAccount(){if(!token())return;const r=await fetch(API+'/api/auth/me',{headers:{Authorization:'Bearer '+token()}});if(!r.ok){localStorage.removeItem('easygo_member_token');return}const data=await r.json();$('#auth-card').classList.add('hidden');$('#account-card').classList.remove('hidden');$('#member-name').textContent=data.member.display_name||'會員';$('#member-email').textContent=data.member.email;$('#ref-link').value=location.origin+location.pathname+'?ref='+encodeURIComponent(data.member.referral_code||'');const [o,c]=await Promise.all([fetch(API+'/api/account/orders',{headers:{Authorization:'Bearer '+token()}}),fetch(API+'/api/account/coupons',{headers:{Authorization:'Bearer '+token()}})]);const orders=o.ok?(await o.json()).orders:[];renderCoupons(c.ok?(await c.json()).coupons:[]);$('#orders').innerHTML=orders.length?orders.map(x=>'<div class="order"><b>'+x.reference+'</b><br>'+x.product_name+'・'+x.plan_name+'・'+x.days+' 日・'+x.quantity+' 張<br>HK$'+x.amount+' · '+x.status+'</div>').join(''):'<p>暫時未有訂單。</p>'}$('#login-tab').onclick=()=>setMode('login');$('#register-tab').onclick=()=>setMode('register');$('#auth-form').onsubmit=async e=>{e.preventDefault();msg('處理中…');const ref=new URLSearchParams(location.search).get('ref')||'';const body={email:$('#email').value.trim(),password:$('#password').value,displayName:$('#name').value.trim(),ref};try{const r=await fetch(API+'/api/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error||'操作失敗');localStorage.setItem('easygo_member_token',data.token);if(mode==='register'){$('#welcome').textContent='註冊成功！你的 9 折優惠碼：'+data.welcome_coupon+(data.referral_coupon?'；推薦註冊 8 折碼：'+data.referral_coupon:'');$('#welcome').classList.remove('hidden')}await loadAccount()}catch(err){msg(err.message)}};$('#copy-link').onclick=async()=>{await navigator.clipboard.writeText($('#ref-link').value);$('#copy-link').textContent='已複製'};$('#logout').onclick=async()=>{await fetch(API+'/api/auth/logout',{method:'POST',headers:{Authorization:'Bearer '+token()}});localStorage.removeItem('easygo_member_token');location.reload()};setMode('login');loadAccount();</script></body></html>
